name: Keep the app awake

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours (UTC); Streamlit Cloud puts apps to sleep after a period with no visits
  workflow_dispatch: {}          # "Run workflow" button on the Actions tab, to test it by hand

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (uses the Google Chrome already on the runner)
        run: pip install --upgrade playwright
      - name: Playwright's own Chromium (only used if Chrome is missing)
        continue-on-error: true
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then python -m playwright install --with-deps chromium; fi
      - name: Open the app (and click "get this app back up" if it is asleep)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: python tools/keep_awake.py
      - name: Keep the screenshot and page text of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-debug
          path: keep_awake_debug/
          if-no-files-found: ignore
          retention-days: 7
